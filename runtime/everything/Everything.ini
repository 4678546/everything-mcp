; everything-mcp - portable settings for the bundled Everything instance.
;
; This file must stay next to everything.exe.  Everything runs in portable mode
; when an Everything.ini exists in its own directory, so the instance is fully
; self-contained: its index database (Everything.db) and settings live here and
; can be deleted without touching any system-wide Everything installation.
;
; The instance is deliberately invisible (no window, taskbar button or tray
; icon) and uses its own name so it never collides with the user's normal
; Everything.  everything-mcp passes -instance everything-mcp when it starts it.

instance_name=everything-mcp
ipc=1
allow_multiple_instances=1

; Stay out of the user's way: no window, no taskbar button, no tray icon.
show_in_taskbar=0
show_tray_icon=0
minimized=1
close_to_tray=0
run_as_admin=0

; The index lives next to everything.exe (portable mode).
db_location=

; Index the fixed NTFS volumes the user already has; removable media is
; skipped so a USB stick does not trigger a full rebuild while it is absent.
auto_include_fixed_volumes=1
auto_include_removable_volumes=0

; Same property set as the Everything defaults this MCP server expects.
index_size=1
index_date_modified=1
